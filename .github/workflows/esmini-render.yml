name: esmini Render

# Called by release.yml once the openx-assets-esmini artifact exists in the run.
on:
  workflow_call:

permissions:
  contents: read

env:
  ESMINI_VERSION: v3.10.0

jobs:
  # Load every vehicle in esmini and tile one frame of each into an image.
  render:
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.render.outputs.failed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download esmini bundle
        uses: actions/download-artifact@v8
        with:
          name: openx-assets-esmini

      - name: Install esmini
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libxrandr2 libxinerama1 libgl1 libglu1-mesa python3-pil
          curl -sfL -o /tmp/esmini.zip \
            "https://github.com/esmini/esmini/releases/download/${ESMINI_VERSION}/esmini-bin_Linux.zip"
          unzip -q /tmp/esmini.zip -d /tmp/esmini

      # A failed render is reported on the PR first; the last step fails the job.
      - name: Render vehicles
        id: render
        run: |
          unzip -q openx-assets-esmini.zip -d bundle
          xvfb-run -a -s "-screen 0 1280x720x24" \
            python3 scripts/esmini_render.py bundle \
              --esmini /tmp/esmini/esmini/bin/esmini --output esmini-render.png \
            || echo "failed=true" >> "$GITHUB_OUTPUT"

      - name: Upload render
        uses: actions/upload-artifact@v7
        with:
          name: esmini-render
          path: esmini-render.png
          if-no-files-found: ignore

      - name: Fail on render problems
        if: steps.render.outputs.failed == 'true'
        run: |
          echo "::error::esmini failed or warned for some vehicles; see the 'Render vehicles' step."
          exit 1

  # Comment images must be served by GitHub, so the render goes to the esmini-renders branch.
  # Pull requests from forks get a read-only token and are skipped.
  comment:
    needs: render
    if: >-
      !cancelled() && needs.render.result != 'skipped' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Download render
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: esmini-render

      - name: Push render to the esmini-renders branch
        id: push
        if: steps.download.outcome == 'success'
        run: |
          image="pr-${PR}/${SHA::7}.png"
          git init -q renders
          cd renders
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Retry in case another pull request pushed in between.
          for _ in 1 2 3; do
            if git fetch -q --depth 1 origin esmini-renders 2>/dev/null; then
              git checkout -q -B esmini-renders FETCH_HEAD
            else
              git symbolic-ref HEAD refs/heads/esmini-renders
            fi
            mkdir -p "$(dirname "$image")"
            cp ../esmini-render.png "$image"
            git add "$image"
            git diff --cached --quiet || git commit -q -m "esmini render for #${PR} at ${SHA::7}"
            if git push -q origin esmini-renders; then
              echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/$(git rev-parse HEAD)/${image}?raw=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1

      - name: Comment on pull request
        env:
          IMAGE_URL: ${{ steps.push.outputs.url }}
          FAILED: ${{ needs.render.outputs.failed }}
          RENDER_RESULT: ${{ needs.render.result }}
        run: |
          marker="<!-- esmini-render -->"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$FAILED" = "true" ] || [ "$RENDER_RESULT" != "success" ]; then
            status=":x: esmini failed or logged warnings for some vehicles. See the [workflow run](${run_url})."
          else
            status=":white_check_mark: Every vehicle loaded in esmini ${ESMINI_VERSION} without warnings."
          fi
          if [ -n "$IMAGE_URL" ]; then
            image="![esmini render of every vehicle](${IMAGE_URL})"
          else
            image="No render was produced."
          fi
          body="${marker}
          ### esmini render at ${SHA::7}

          ${status}

          ${image}"
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
