[project]
name = "openx-assets"
version = "0.3.0"
authors = [{name="Dogan Ulus", email="dogan.ulus@bogazici.edu.tr" }]
description = "Develop simulation assets using ASAM OpenX standards"
readme = "python/openx_assets/README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "bpy>=5.2,<5.3", # Blender 5.2 LTS, matching the .blend files; provides mathutils
]
license-files = ["python/openx_assets/LICENSE"]

[project.urls]
"Homepage" = "https://github.com/vevalabs/openx-assets/"
"Bug Tracker" = "https://github.com/vevalabs/openx-assets/issues"

[project.scripts]
openx-assets = "openx_assets.cli:main"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]
namespaces = false

[tool.setuptools.package-data]
openx_assets = [
    "schemas/**/*.json"
]
